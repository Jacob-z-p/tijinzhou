services:
  redis:
    image: redis:8
    container_name: tijinzhou-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --appendonly yes --requirepass 123456
    volumes:
      - tijinzhou-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "123456", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  tijinzhou-redis-data:
